<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ALDA — AI Meeting Coach</title>
  <desc id="desc">Capa visual para o projeto ALDA, um assistente de reuniões com inteligência artificial.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150c2b"/>
      <stop offset="0.55" stop-color="#20124d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#g)"/>
  <circle cx="955" cy="145" r="190" fill="#ffffff" opacity="0.06"/>
  <circle cx="250" cy="650" r="260" fill="#8b5cf6" opacity="0.10"/>
  <rect x="110" y="110" width="980" height="580" rx="44" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="600" y="335" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="124" font-weight="800" fill="#ffffff">ALDA</text>
  <rect x="360" y="385" width="480" height="8" rx="4" fill="url(#accent)"/>
  <text x="600" y="465" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="600" fill="#f8fafc">AI Meeting Coach</text>
  <text x="600" y="525" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="#cbd5e1">Preparação • Transcrição • Resumos • Follow-up</text>
</svg>
