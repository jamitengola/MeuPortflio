<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Observatório Nacional do Emprego</title>
  <desc id="desc">Capa visual para dashboards e soluções de dados do Observatório Nacional do Emprego.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04111f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="110" y="110" width="980" height="580" rx="42" fill="#ffffff" opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="600" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#f8fafc">Observatório Nacional do Emprego</text>
  <text x="600" y="275" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" fill="#cbd5e1">Dados • Indicadores • Power BI • Políticas Públicas</text>
  <g transform="translate(255 360)">
    <rect x="0" y="120" width="90" height="170" rx="14" fill="url(#bar)"/>
    <rect x="150" y="65" width="90" height="225" rx="14" fill="url(#bar)" opacity="0.92"/>
    <rect x="300" y="20" width="90" height="270" rx="14" fill="url(#bar)" opacity="0.84"/>
    <rect x="450" y="95" width="90" height="195" rx="14" fill="url(#bar)" opacity="0.76"/>
    <rect x="600" y="45" width="90" height="245" rx="14" fill="url(#bar)" opacity="0.68"/>
  </g>
</svg>
