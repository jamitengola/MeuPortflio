<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Portal SIAC</title>
  <desc id="desc">Capa visual para portal de agendamento e atendimento digital.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="120" y="110" width="960" height="580" rx="48" fill="#ffffff" opacity="0.07" stroke="#ffffff" stroke-opacity="0.18"/>
  <rect x="250" y="240" width="700" height="390" rx="30" fill="#020617" stroke="#334155"/>
  <rect x="250" y="240" width="700" height="84" rx="30" fill="url(#accent)"/>
  <circle cx="315" cy="282" r="12" fill="#ffffff" opacity="0.9"/>
  <circle cx="355" cy="282" r="12" fill="#ffffff" opacity="0.7"/>
  <circle cx="395" cy="282" r="12" fill="#ffffff" opacity="0.5"/>
  <text x="600" y="425" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="800" fill="#ffffff">SIAC</text>
  <text x="600" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" fill="#cbd5e1">Agendamento Digital</text>
  <text x="600" y="555" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#94a3b8">Serviços públicos • Filas • Atendimento • Gestão</text>
</svg>
